workflows:
  ios-app-store:
    name: WantBoard iOS — App Store / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.wantboard.app"
        # Set APPLE_TEAM_ID in Codemagic → Environment Variables (app_store_credentials group)
        # Find it at developer.apple.com → Account → Membership Details → Team ID (10 chars, e.g. ABC123DEFG)
      node: 20.20.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods
        - ios/App/Pods
    integrations:
      app_store_connect: WantBoard App Store Connect API Key
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build the web bundle (Vite -> dist/)
        script: |
          npm run build
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Generate iOS app icons and splash screens
        script: |
          npm run icons
      - name: Sync web build into iOS project
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing (App Store Connect API)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Disable automatic code signing
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          # Switch from automatic to manual signing so the fetched profile is used
          sed -i "" "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$PBXPROJ"
          # Inject the Apple Team ID (required for manual signing)
          sed -i "" "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = \"$APPLE_TEAM_ID\";/g" "$PBXPROJ"
          echo "Code signing patched — team: $APPLE_TEAM_ID, style: Manual"
      - name: Bump build number to match App Store Connect
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" || echo "0")
          cd ios/App
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build the iOS archive (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
      email:
        recipients:
          - $CM_BUILD_NOTIFY_EMAIL
        notify:
          success: true
          failure: true
