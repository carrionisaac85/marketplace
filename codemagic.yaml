workflows:
  ios-app-store:
    name: WantBoard iOS — App Store / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
        - firebase_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.wantboard.app"
        VITE_GOOGLE_IOS_CLIENT_ID: 445461567451-l624o1lvgm32o2ev74circibb1c8i8rj.apps.googleusercontent.com
        VITE_GOOGLE_WEB_CLIENT_ID: 445461567451-fma547vrdmhhb6101udmv0th6no8elng.apps.googleusercontent.com
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wantboard.app
      node: 20.9.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods
    integrations:
      app_store_connect: Codemagic App
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Deploy Firebase Storage rules
        script: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "ERROR: FIREBASE_TOKEN is not set — cannot deploy Storage rules. Add it to the firebase_credentials group in Codemagic."
            exit 1
          fi
          echo "firebase-tools version: $(npx firebase-tools --version)"
          npx firebase-tools deploy --only storage --token "$FIREBASE_TOKEN" --project marketplace305 --non-interactive
          echo "✔ Storage rules deployed — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Deploy Firestore rules
        script: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "ERROR: FIREBASE_TOKEN is not set — cannot deploy Firestore rules. Add it to the firebase_credentials group in Codemagic."
            exit 1
          fi
          echo "firebase-tools version: $(npx firebase-tools --version)"
          npx firebase-tools deploy --only firestore --token "$FIREBASE_TOKEN" --project marketplace305 --non-interactive
          echo "✔ Firestore rules deployed — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Build the web bundle (Vite -> dist/)
        script: |
          npm run build
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Generate iOS app icons and splash screens
        script: |
          npm run icons
      - name: Sync web build into iOS project
        script: |
          npx cap sync ios
      - name: Restore Google subspec in Podfile (cap sync strips it)
        script: |
          PODFILE="ios/App/Podfile"
          echo "=== Podfile CapacitorFirebaseAuthentication line BEFORE restore ==="
          grep -n "CapacitorFirebaseAuthentication" "$PODFILE" || true
          # npx cap sync rewrites the whole `def capacitor_pods ... end` block and
          # emits `pod 'CapacitorFirebaseAuthentication'` WITHOUT the /Google subspec
          # (Capacitor has no concept of subspecs). That reverts the plugin to the
          # default Lite subspec — no GoogleSignIn, no RGCFA_INCLUDE_GOOGLE flag.
          # Re-add the /Google subspec so the final `pod install` links GoogleSignIn.
          sed -i "" "s|pod 'CapacitorFirebaseAuthentication', :path|pod 'CapacitorFirebaseAuthentication/Google', :path|" "$PODFILE"
          echo "=== Podfile CapacitorFirebaseAuthentication line AFTER restore ==="
          grep -n "CapacitorFirebaseAuthentication" "$PODFILE"
          if ! grep -q "CapacitorFirebaseAuthentication/Google" "$PODFILE"; then
            echo "ERROR: failed to restore the /Google subspec in the Podfile"
            exit 1
          fi
      - name: Guarantee FirebaseAuthentication config + packageClassList
        script: |
          CONFIG="ios/App/App/capacitor.config.json"
          echo "=== capacitor.config.json BEFORE patch ==="
          cat "$CONFIG"
          node -e "
            const fs = require('fs');
            const p = '$CONFIG';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.plugins = cfg.plugins || {};
            delete cfg.plugins.GoogleAuth;
            cfg.plugins.FirebaseAuthentication = { skipNativeAuth: true, providers: ['google.com', 'apple.com'] };
            const orig = Array.isArray(cfg.packageClassList) ? cfg.packageClassList.slice() : null;
            console.log('=== packageClassList generated by cap sync ===');
            console.log(JSON.stringify(orig));
            if (orig === null) {
              console.error('ERROR: packageClassList missing — cap sync did not regenerate it. Every native plugin would be UNIMPLEMENTED at runtime.');
              process.exit(1);
            }
            if (orig.length === 0) {
              console.error('ERROR: packageClassList is empty — cap sync registered no native plugins.');
              process.exit(1);
            }
            if (!orig.includes('FirebaseAuthenticationPlugin')) {
              console.log('WARNING: FirebaseAuthenticationPlugin was NOT in cap sync output — adding it so the plugin registers at runtime.');
              cfg.packageClassList.push('FirebaseAuthenticationPlugin');
            } else {
              console.log('OK: FirebaseAuthenticationPlugin present in cap sync packageClassList.');
            }
            fs.writeFileSync(p, JSON.stringify(cfg, null, '\t'));
            console.log('=== capacitor.config.json AFTER patch ===');
            console.log(JSON.stringify(cfg, null, 2));
          "
      - name: Patch Google Sign-In URL scheme in Info.plist
        script: |
          if [ -n "$VITE_GOOGLE_IOS_CLIENT_ID" ]; then
            REVERSED="com.googleusercontent.apps.$(echo "$VITE_GOOGLE_IOS_CLIENT_ID" | sed 's/\.apps\.googleusercontent\.com//')"
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 $REVERSED" ios/App/App/Info.plist
            echo "Patched REVERSED_CLIENT_ID to: $REVERSED"
          else
            echo "WARNING: VITE_GOOGLE_IOS_CLIENT_ID is not set — Google Sign-In URL scheme not patched."
          fi
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          # Clean any stale Pods/lockfile so CocoaPods resolves GoogleSignIn
          # fresh against the pinned `= 9.0.0` constraint. A cached Podfile.lock
          # from a previous build can pin 9.1.0 and cause a version conflict
          # with CapacitorFirebaseAuthentication/Google (requires = 9.0.0).
          rm -rf Pods Podfile.lock
          pod install --repo-update
      - name: Verify Google Sign-In compile flag and pods
        script: |
          echo "=== Confirm GoogleSignIn pod installed (explicit pod + /Google subspec) ==="
          if grep -qE "GoogleSignIn" ios/App/Podfile.lock; then
            echo "OK: GoogleSignIn present in Podfile.lock"
            grep -E "GoogleSignIn" ios/App/Podfile.lock
          else
            echo "ERROR: GoogleSignIn not in Podfile.lock — Google Sign-In will not work!"
            exit 1
          fi
          echo ""
          echo "=== Confirm GoogleSignIn pod sources were actually downloaded/linked ==="
          if [ -d "ios/App/Pods/GoogleSignIn" ]; then
            echo "OK: ios/App/Pods/GoogleSignIn exists"
            ls -la ios/App/Pods/GoogleSignIn | head
          else
            echo "ERROR: ios/App/Pods/GoogleSignIn directory missing — the GoogleSignIn pod did not install!"
            exit 1
          fi
          echo ""
          echo "=== Confirm FirebaseAuth iOS provider dependency is installed ==="
          if grep -qE "FirebaseAuth" ios/App/Podfile.lock; then
            echo "OK: FirebaseAuth present in Podfile.lock"
            grep -E "FirebaseAuth \(" ios/App/Podfile.lock | head -1
          else
            echo "ERROR: FirebaseAuth not in Podfile.lock — FirebaseAuthentication native deps are incomplete!"
            exit 1
          fi
          echo ""
          echo "=== Confirm RGCFA_INCLUDE_GOOGLE compile flag is set on the plugin target ==="
          # The flag can come from the subspec xcconfig (Target Support Files) and/or
          # the Podfile post_install (written into Pods.xcodeproj/project.pbxproj).
          # Accept it being present anywhere under ios/App/Pods.
          if grep -rq "RGCFA_INCLUDE_GOOGLE" ios/App/Pods/ 2>/dev/null; then
            echo "OK: RGCFA_INCLUDE_GOOGLE found in the generated Pods build config"
            grep -rn "RGCFA_INCLUDE_GOOGLE" ios/App/Pods/ 2>/dev/null | head
          else
            echo "ERROR: RGCFA_INCLUDE_GOOGLE not found anywhere in ios/App/Pods — Google Sign-In native code will be compiled out!"
            exit 1
          fi
          echo ""
          echo "=== Confirm -ObjC linker flag landed on the App target (prevents plugin dead-strip) ==="
          # post_install writes OTHER_LDFLAGS = -ObjC into the App target inside
          # App.xcodeproj/project.pbxproj. Without it, statically-linked Capacitor
          # plugin classes registered by name (NSClassFromString) get dead-stripped
          # → "FirebaseAuthentication plugin not implemented on iOS".
          if grep -q "\"-ObjC\"" ios/App/App.xcodeproj/project.pbxproj || grep -q "\\-ObjC" ios/App/App.xcodeproj/project.pbxproj; then
            echo "OK: -ObjC present in App.xcodeproj/project.pbxproj"
          else
            echo "ERROR: -ObjC not found in App target build settings — plugin classes may be dead-stripped at runtime!"
            exit 1
          fi
      - name: Set up code signing (uploaded certificate + profile)
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --verbose
      - name: Force manual signing in Xcode project
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          PROFILE=$(find \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "/Users/builder/Library/MobileDevice/Provisioning Profiles" \
            -maxdepth 1 -name "*.mobileprovision" 2>/dev/null | head -1)

          if [ -z "$PROFILE" ]; then
            echo "ERROR: No provisioning profile found — ensure it is uploaded in Codemagic → Code signing → iOS"
            ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "(dir not found)"
            ls -la "/Users/builder/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "(dir not found)"
            exit 1
          fi

          echo "Using profile: $PROFILE"
          PROFILE_DATA=$(security cms -D -i "$PROFILE" 2>/dev/null)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< "$PROFILE_DATA")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$PROFILE_DATA")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PROFILE_DATA")

          echo "Team ID:      $TEAM_ID"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile name: $PROFILE_NAME"

          sed -i "" "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$PBXPROJ"
          sed -i "" "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = \"$TEAM_ID\";/g" "$PBXPROJ"
          sed -i "" "s/DEVELOPMENT_TEAM = \"[^\"]*\";/DEVELOPMENT_TEAM = \"$TEAM_ID\";/g" "$PBXPROJ"
          sed -i "" "s/PROVISIONING_PROFILE_SPECIFIER = \"\";/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\";/g" "$PBXPROJ"

          echo "project.pbxproj patched"
          echo "TEAM_ID=$TEAM_ID" >> $CM_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
      - name: Bump build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build the iOS archive (.ipa)
        script: |
          ARCHIVE_PATH="/tmp/App.xcarchive"
          IPA_DIR="build/ios/ipa"
          mkdir -p "$IPA_DIR"

          echo "=== xcodebuild archive ==="
          set -o pipefail
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            2>&1 | tee /tmp/xcodebuild_archive.log | grep -E "error:|warning:|ARCHIVE SUCCEEDED|Build succeeded"

          echo "=== xcodebuild export ==="
          PLIST=/tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Clear dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadBitcode bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.wantboard.app string $PROFILE_UUID" "$PLIST"
          echo "ExportOptions.plist written"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$IPA_DIR" \
            2>&1 | tee /tmp/xcodebuild_export.log | grep -E "error:|warning:|EXPORT SUCCEEDED|Export succeeded"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_export.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
      slack:
        channel: "#builds"
        notify_on_build_start: false
        notify:
          success: false
          failure: true
      email:
        recipients:
          - $CM_BUILD_NOTIFY_EMAIL
        notify:
          success: true
          failure: true
