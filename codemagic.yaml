workflows:
  ios-app-store:
    name: WantBoard iOS — App Store / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
        - firebase_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.wantboard.app"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wantboard.app
      node: 20.9.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods
        - ios/App/Pods
    integrations:
      app_store_connect: Codemagic App
    scripts:
      - name: Install npm dependencies
        script: |
          # Self-heal: strip Replit's internal package proxy host from the
          # lockfile if a Replit-generated lockfile ever lands here. That host
          # only resolves inside Replit's network and breaks npm install on CI.
          if grep -q "package-firewall.replit.local" package-lock.json; then
            echo "Rewriting Replit firewall URLs in package-lock.json -> registry.npmjs.org"
            sed -i '' 's|http://package-firewall.replit.local/npm/|https://registry.npmjs.org/|g' package-lock.json
          fi
          npm install
      - name: Deploy Firebase Storage rules
        script: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "ERROR: FIREBASE_TOKEN is not set — cannot deploy Storage rules. Add it to the firebase_credentials group in Codemagic."
            exit 1
          fi
          echo "firebase-tools version: $(npx firebase-tools --version)"
          npx firebase-tools deploy --only storage --token "$FIREBASE_TOKEN" --project marketplace305 --non-interactive
          echo "✔ Storage rules deployed — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Deploy Firestore rules
        script: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "ERROR: FIREBASE_TOKEN is not set — cannot deploy Firestore rules. Add it to the firebase_credentials group in Codemagic."
            exit 1
          fi
          echo "firebase-tools version: $(npx firebase-tools --version)"
          npx firebase-tools deploy --only firestore --token "$FIREBASE_TOKEN" --project marketplace305 --non-interactive
          echo "✔ Firestore rules deployed — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Build the web bundle (Vite -> dist/)
        script: |
          npm run build
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Generate iOS app icons and splash screens
        script: |
          npm run icons
      - name: Sync web build into iOS project
        script: |
          npx cap sync ios
      - name: Inject Google REVERSED_CLIENT_ID URL scheme into Info.plist
        script: |
          # GoogleSignIn 7.x requires the reversed OAuth client ID as a URL scheme
          # so it can complete the sign-in redirect after authentication.
          # We read REVERSED_CLIENT_ID directly from the committed GoogleService-Info.plist
          # — no Codemagic env var needed.
          python3 - <<'PYEOF'
          import plistlib, sys
          gsi_path  = "ios/App/App/GoogleService-Info.plist"
          info_path = "ios/App/App/Info.plist"
          with open(gsi_path, "rb") as f:
              gsi = plistlib.load(f)
          reversed_id = gsi.get("REVERSED_CLIENT_ID", "")
          if not reversed_id:
              print("ERROR: REVERSED_CLIENT_ID missing from GoogleService-Info.plist")
              sys.exit(1)
          with open(info_path, "rb") as f:
              plist = plistlib.load(f)
          url_types = plist.setdefault("CFBundleURLTypes", [])
          for entry in url_types:
              if reversed_id in entry.get("CFBundleURLSchemes", []):
                  print("Already present: " + reversed_id)
                  sys.exit(0)
          url_types.append({"CFBundleURLName": "GoogleSignIn", "CFBundleURLSchemes": [reversed_id]})
          with open(info_path, "wb") as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_XML)
          print("Added REVERSED_CLIENT_ID URL scheme: " + reversed_id)
          PYEOF
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing (uploaded certificate + profile)
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --verbose
      - name: Force manual signing in Xcode project
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          PROFILE=$(find \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "/Users/builder/Library/MobileDevice/Provisioning Profiles" \
            -maxdepth 1 -name "*.mobileprovision" 2>/dev/null | head -1)

          if [ -z "$PROFILE" ]; then
            echo "ERROR: No provisioning profile found — ensure it is uploaded in Codemagic → Code signing → iOS"
            ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "(dir not found)"
            ls -la "/Users/builder/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "(dir not found)"
            exit 1
          fi

          echo "Using profile: $PROFILE"
          PROFILE_DATA=$(security cms -D -i "$PROFILE" 2>/dev/null)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< "$PROFILE_DATA")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$PROFILE_DATA")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PROFILE_DATA")

          echo "Team ID:      $TEAM_ID"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile name: $PROFILE_NAME"

          sed -i "" "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$PBXPROJ"
          sed -i "" "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = \"$TEAM_ID\";/g" "$PBXPROJ"
          sed -i "" "s/DEVELOPMENT_TEAM = \"[^\"]*\";/DEVELOPMENT_TEAM = \"$TEAM_ID\";/g" "$PBXPROJ"
          sed -i "" "s/PROVISIONING_PROFILE_SPECIFIER = \"\";/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\";/g" "$PBXPROJ"

          echo "project.pbxproj patched"
          echo "TEAM_ID=$TEAM_ID" >> $CM_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
      - name: Bump build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build the iOS archive (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
      slack:
        channel: "#builds"
        notify_on_build_start: false
        notify:
          success: false
          failure: true
      email:
        recipients:
          - carrion.isaac85@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: WantBoard Android — Google Play
    instance_type: linux_x2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      groups:
        - android_credentials
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.wantboard.app"
      node: 20.9.0
      java: 21
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Install npm dependencies
        script: |
          # Self-heal: strip Replit's internal package proxy host from the
          # lockfile so npm install works on CI.
          if grep -q "package-firewall.replit.local" package-lock.json; then
            echo "Rewriting Replit firewall URLs in package-lock.json -> registry.npmjs.org"
            sed -i 's|http://package-firewall.replit.local/npm/|https://registry.npmjs.org/|g' package-lock.json
          fi
          npm install
      - name: Build the web bundle (Vite -> dist/)
        script: |
          npm run build
      - name: Generate Android icons and splash screens
        script: |
          npm run icons:android
      - name: Sync web build into Android project
        script: |
          npx cap sync android
      - name: Verify signing env vars are present
        script: |
          for VAR in KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!VAR}" ]; then
              echo "ERROR: $VAR is not set. Add it to the android_credentials group in Codemagic."
              exit 1
            fi
          done
          echo "All signing variables present."
      - name: Decode keystore from base64 env var
        script: |
          echo "$KEYSTORE_FILE" | base64 --decode > android/app/keystore.jks
      - name: Build signed Android App Bundle (.aab)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - carrion.isaac85@gmail.com
        notify:
          success: true
          failure: true
