name: Firebase Token Rotation Reminder

on:
  schedule:
    # Runs at 09:00 UTC on the 24th of May and November (every 6 months)
    - cron: '0 9 24 5 *'
    - cron: '0 9 24 11 *'
  workflow_dispatch:

jobs:
  create-reminder-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open rotation reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔑 Rotate FIREBASE_TOKEN CI secret';
            const body = `## Firebase CI Token Rotation Due

            The \`FIREBASE_TOKEN\` GitHub secret should be rotated every 6–12 months to stay secure.

            ### Steps
            1. Run \`npx firebase-tools login:ci\` locally and copy the new token.
            2. Go to **Settings → Secrets and variables → Actions** in this repo.
            3. Update **\`FIREBASE_TOKEN\`** with the new value.
            4. Revoke the old token: \`npx firebase-tools logout --token OLD_TOKEN\`
            5. Trigger the **Deploy Firebase Rules** workflow to confirm everything still works.
            6. Update the rotation log in \`docs/firebase-token-rotation.md\`.

            Full runbook: [docs/firebase-token-rotation.md](../blob/main/docs/firebase-token-rotation.md)

            > **Tip:** Consider migrating to keyless Google Workload Identity Federation
            > to eliminate long-lived tokens entirely — see the runbook for details.
            `;

            // Avoid duplicate open issues
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,maintenance',
            });

            const alreadyOpen = existing.data.some(i => i.title === title);
            if (alreadyOpen) {
              console.log('Reminder issue already open — skipping creation.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'maintenance'],
            });
            console.log('Rotation reminder issue created.');
