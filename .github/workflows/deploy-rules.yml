name: Deploy Firebase Rules
# FIREBASE_TOKEN must be rotated every 6–12 months.
# Rotation runbook: docs/firebase-token-rotation.md
# A scheduled reminder issue is opened automatically by firebase-token-reminder.yml.

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - storage.rules
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Firestore and Storage rules
        run: npm run deploy:rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
